name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # No later step pushes with git: the tag action and the release action
          # both talk to the REST API with the github_token input.
          persist-credentials: false

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true

      - name: Release summary
        # Step outputs go through env, never expression syntax in the script: the
        # changelog is built from commit messages and must stay plain data.
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          NEW_VERSION: ${{ steps.tag.outputs.new_version }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          {
            printf '%s\n' "## Release Created" ""
            printf '**Tag:** %s\n' "$NEW_TAG"
            printf '**Version:** %s\n' "$NEW_VERSION"
            printf '%s\n' "" "### Changelog"
            printf '%s\n' "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"
