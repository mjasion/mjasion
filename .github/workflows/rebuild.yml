name: Scheduled Rebuild

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    name: Trigger Cloudflare Pages Rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        # A Pages deploy hook is authorized by its URL alone, so the URL is a
        # secret and no Cloudflare API credentials are sent with it.
        env:
          HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Repository secret CF_DEPLOY_HOOK_URL is not set (Cloudflare Pages deploy hook URL)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
